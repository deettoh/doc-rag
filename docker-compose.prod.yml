# Docker Compose Overrides for DocRAG Production Deployment
# Usage: set COMPOSE_FILE in .env, then docker compose up -d

services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  backend:
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/docrag
      ENVIRONMENT: production
      DEBUG: "false"
    ports: !override
      - "127.0.0.1:8000:8000"
    volumes: !override
      - pdf_storage:/app/storage/pdfs

  frontend:
    volumes: !reset []
