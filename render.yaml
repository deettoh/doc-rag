# free instance types cannot mount a disk, hence starter

services:
  - type: web
    name: docrag-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: pdf-storage
      mountPath: /app/storage/pdfs
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docrag-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

databases:
  - name: docrag-db
    databaseName: docrag
    plan: free
    postgresMajorVersion: "17"
